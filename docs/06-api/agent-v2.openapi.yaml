openapi: 3.1.0
info:
  title: OpenEIP Agent Platform API
  version: 2.0.0-draft
  description: Tenant-scoped v0.6 Agent management and execution contract.
security: [{ bearerAuth: [] }]
servers:
  - url: /
    description: Same-origin OpenEIP gateway
paths:
  /api/v2/agents:
    get:
      operationId: listAgentDefinitions
      summary: List Agent definitions
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Page" },
          "401": { $ref: "#/components/responses/Error" },
        }
    post:
      operationId: createAgentDefinition
      summary: Create an Agent definition and draft
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateAgent" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "400": { $ref: "#/components/responses/Error" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}:
    get:
      operationId: getAgentDefinition
      summary: Get an Agent definition
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
    patch:
      operationId: updateAgentDraft
      summary: Update an Agent draft
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/merge-patch+json:
                { schema: { type: object, maxProperties: 32 } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
          "412": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}/versions:
    get:
      operationId: listAgentVersions
      summary: List immutable Agent candidate snapshots and published versions
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
  /api/v2/agents/{agentId}/versions:candidate:
    post:
      operationId: createAgentVersionCandidate
      summary: Freeze the current draft as an immutable Evaluation candidate
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
          "412": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}:archive:
    post:
      operationId: archiveAgentDefinition
      summary: Archive an Agent definition for new runs
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}/versions/{version}:restore-draft:
    post:
      operationId: restoreAgentVersionAsDraft
      summary: Copy an immutable Agent version into a new draft
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          {
            name: version,
            in: path,
            required: true,
            schema: { type: integer, minimum: 1 },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}/versions:publish:
    post:
      operationId: publishAgentVersion
      summary: Promote the evaluated current-draft candidate to a published version
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      additionalProperties: false,
                      required: [evaluationRunId],
                      properties:
                        { evaluationRunId: { type: string, format: uuid } },
                    },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
          "412": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agents/{agentId}/runs:
    post:
      operationId: createAgentRun
      summary: Create an Agent run
      parameters:
        [
          { $ref: "#/components/parameters/AgentId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateRun" } },
            },
        }
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "403": { $ref: "#/components/responses/Error" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs:
    get:
      operationId: listAgentRuns
      summary: List tenant-scoped Agent runs
      parameters:
        [
          {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    QUEUED,
                    PLANNING,
                    EXECUTING,
                    REFLECTING,
                    PAUSED,
                    SUCCEEDED,
                    FAILED,
                    CANCELLED,
                  ],
              },
          },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
  /api/v2/agent-runs/{runId}:
    get:
      operationId: getAgentRun
      summary: Get an Agent run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs/{runId}/events:
    get:
      operationId: listAgentRunEvents
      summary: List ordered Agent run events
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          {
            name: afterSequence,
            in: query,
            schema: { type: integer, minimum: 0 },
          },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
  /api/v2/agent-runs/{runId}:cancel:
    post:
      operationId: cancelAgentRun
      summary: Request Agent run cancellation
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs/{runId}:pause:
    post:
      operationId: pauseAgentRun
      summary: Request Agent run pause at a safe checkpoint
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs/{runId}:resume:
    post:
      operationId: resumeAgentRun
      summary: Resume a paused Agent run
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs/{runId}/steps/{stepId}:retry:
    post:
      operationId: retryAgentStep
      summary: Retry a failed Agent step
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          {
            name: stepId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/agent-runs/{runId}/approvals/{approvalId}:decide:
    post:
      operationId: decideAgentToolApproval
      summary: Approve or reject an expiring Tool call
      parameters:
        [
          { $ref: "#/components/parameters/RunId" },
          {
            name: approvalId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVE, REJECT] }
                reason: { type: string, maxLength: 500 }
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/tools:
    get:
      operationId: listTools
      summary: List governed Tool versions
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
  /api/v2/tool-grants:
    get:
      operationId: listToolGrants
      summary: List Agent Tool grants
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createToolGrant
      summary: Create an Agent Tool grant
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateGrant" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/tool-grants/{grantId}:
    delete:
      operationId: revokeToolGrant
      summary: Revoke a Tool grant for future calls
      parameters:
        [
          {
            name: grantId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v2/memories:
    get:
      operationId: listMemoryEntries
      summary: List governed Memory metadata
      parameters:
        [
          { name: purpose, in: query, schema: { type: string, maxLength: 64 } },
          {
            name: state,
            in: query,
            schema:
              { type: string, enum: [ACTIVE, QUARANTINED, DELETING, DELETED] },
          },
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
  /api/v2/memories/{memoryId}:
    get:
      operationId: getMemoryEntry
      summary: Get authorized Memory metadata and provenance
      parameters: [{ $ref: "#/components/parameters/MemoryId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
    delete:
      operationId: deleteMemoryEntry
      summary: Tombstone and purge a Memory entry
      parameters:
        [
          { $ref: "#/components/parameters/MemoryId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v2/memories/{memoryId}:quarantine:
    post:
      operationId: quarantineMemoryEntry
      summary: Quarantine a Memory entry from retrieval
      parameters:
        [
          { $ref: "#/components/parameters/MemoryId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses: { "200": { $ref: "#/components/responses/Object" } }
  /api/v2/memories:export:
    post:
      operationId: exportMemoryMetadata
      summary: Create a bounded Memory metadata export
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                purpose: { type: string, maxLength: 64 }
                includeContent: { type: boolean, const: false, default: false }
      responses: { "202": { $ref: "#/components/responses/Object" } }
  /api/v2/mcp-servers:
    get:
      operationId: listMcpServers
      summary: List registered MCP Servers
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createMcpServer
      summary: Register an MCP Server
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CreateMcpServer" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/mcp-servers/{serverId}:
    get:
      operationId: getMcpServer
      summary: Get a non-secret MCP Server registration
      parameters: [{ $ref: "#/components/parameters/ServerId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
    patch:
      operationId: updateMcpServer
      summary: Update an MCP Server draft registration
      parameters:
        [
          { $ref: "#/components/parameters/ServerId" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { type: object, maxProperties: 16 }
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "412": { $ref: "#/components/responses/Error" },
        }
    delete:
      operationId: disableMcpServer
      summary: Disable an MCP Server and close new sessions
      parameters:
        [
          { $ref: "#/components/parameters/ServerId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses: { "202": { $ref: "#/components/responses/Object" } }
  /api/v2/mcp-servers/{serverId}:test:
    post:
      operationId: testMcpServerPolicy
      summary: Test MCP transport authentication and egress policy
      parameters:
        [
          { $ref: "#/components/parameters/ServerId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses: { "202": { $ref: "#/components/responses/Object" } }
  /api/v2/mcp-servers/{serverId}:discover:
    post:
      operationId: discoverMcpCapabilities
      summary: Discover quarantined MCP capabilities
      parameters:
        [
          { $ref: "#/components/parameters/ServerId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/mcp-servers/{serverId}/capabilities/{capabilityId}:map-tool:
    post:
      operationId: mapMcpCapabilityToTool
      summary: Approve an MCP capability as an immutable Tool version
      parameters:
        [
          { $ref: "#/components/parameters/ServerId" },
          {
            name: capabilityId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "201": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/v2/evaluation-datasets:
    get:
      operationId: listEvaluationDatasets
      summary: List Evaluation datasets and immutable versions
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createEvaluationDataset
      summary: Create an Evaluation dataset draft
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
      responses: { "201": { $ref: "#/components/responses/Object" } }
  /api/v2/evaluation-suites:
    get:
      operationId: listEvaluationSuites
      summary: List Evaluation suites
      parameters:
        [
          { $ref: "#/components/parameters/Cursor" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/Page" } }
    post:
      operationId: createEvaluationSuite
      summary: Create a versioned Evaluation suite and regression gates
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, datasetVersionIds]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                datasetVersionIds:
                  type: array
                  minItems: 1
                  maxItems: 32
                  uniqueItems: true
                  items: { type: string, format: uuid }
                gatePolicy: { type: object, maxProperties: 32 }
      responses: { "201": { $ref: "#/components/responses/Object" } }
  /api/v2/evaluation-runs:
    post:
      operationId: createEvaluationRun
      summary: Start a candidate versus baseline Evaluation run
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/CreateEvaluationRun" },
                },
            },
        }
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "422": { $ref: "#/components/responses/Error" },
        }
  /api/v2/evaluation-runs/{evaluationRunId}:
    get:
      operationId: getEvaluationRun
      summary: Get an Evaluation run and gate result
      parameters: [{ $ref: "#/components/parameters/EvaluationRunId" }]
      responses:
        {
          "200": { $ref: "#/components/responses/Object" },
          "404": { $ref: "#/components/responses/Error" },
        }
  /api/v2/evaluation-runs/{evaluationRunId}:cancel:
    post:
      operationId: cancelEvaluationRun
      summary: Cancel an active Evaluation run
      parameters:
        [
          { $ref: "#/components/parameters/EvaluationRunId" },
          { $ref: "#/components/parameters/IdempotencyKey" },
          { $ref: "#/components/parameters/IfMatch" },
        ]
      responses:
        {
          "202": { $ref: "#/components/responses/Object" },
          "409": { $ref: "#/components/responses/Error" },
        }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AgentId:
      {
        name: agentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    RunId:
      {
        name: runId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    MemoryId:
      {
        name: memoryId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ServerId:
      {
        name: serverId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    EvaluationRunId:
      {
        name: evaluationRunId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Cursor:
      { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
      }
    IfMatch:
      {
        name: If-Match,
        in: header,
        required: true,
        schema: { type: string, maxLength: 80 },
      }
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 128 },
      }
  schemas:
    CreateAgent:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type:
          { type: string, enum: [DOCUMENT, SQL, BI, SEARCH, WORKFLOW, CUSTOM] }
        description: { type: string, maxLength: 1000 }
    CreateRun:
      type: object
      additionalProperties: false
      required: [agentVersion, input]
      properties:
        agentVersion: { type: integer, minimum: 1 }
        input: { type: string, minLength: 1, maxLength: 32000 }
        resourceHandles:
          {
            type: array,
            maxItems: 64,
            uniqueItems: true,
            items: { type: string, maxLength: 256 },
          }
        sessionId: { type: string, format: uuid }
        budget: { $ref: "#/components/schemas/Budget" }
    Budget:
      type: object
      additionalProperties: false
      properties:
        maxSteps: { type: integer, minimum: 1, maximum: 64, default: 32 }
        maxDurationSeconds:
          { type: integer, minimum: 1, maximum: 1800, default: 600 }
        maxToolCalls: { type: integer, minimum: 0, maximum: 128, default: 64 }
        maxWorkers: { type: integer, minimum: 0, maximum: 16, default: 4 }
    CreateGrant:
      type: object
      additionalProperties: false
      required:
        [
          agentVersionId,
          toolVersionId,
          operations,
          resourceSelector,
          approvalMode,
        ]
      properties:
        agentVersionId: { type: string, format: uuid }
        toolVersionId: { type: string, format: uuid }
        operations:
          {
            type: array,
            minItems: 1,
            maxItems: 32,
            uniqueItems: true,
            items: { type: string, pattern: "^[a-z][a-z0-9.:-]{0,127}$" },
          }
        resourceSelector: { type: object, maxProperties: 16 }

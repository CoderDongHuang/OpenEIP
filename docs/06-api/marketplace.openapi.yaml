openapi: 3.1.0
info:
  title: OpenEIP Marketplace API
  version: 0.8.0-alpha
paths:
  /api/v1/marketplace/public/packages:
    get:
      summary: List published Marketplace packages
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [PLUGIN, CONNECTOR, AGENT]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200': {description: Published package page}
  /api/v1/marketplace/packages:
    get:
      summary: List packages in the current tenant
      responses:
        '200': {description: Tenant package page}
    post:
      summary: Register a package
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      responses:
        '201': {description: Package created}
  /api/v1/marketplace/packages/{packageId}/versions:
    post:
      summary: Register an immutable package artifact
      parameters:
        - {name: packageId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      responses:
        '201': {description: Version created}
  /api/v1/marketplace/packages/{packageId}/versions/{versionId}:publish:
    post:
      summary: Publish a reviewed version
      parameters:
        - {name: packageId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
        - {name: If-Match, in: header, required: true, schema: {type: string}}
      responses:
        '200': {description: Published version}
